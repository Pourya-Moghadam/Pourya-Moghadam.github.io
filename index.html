<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAF9F6" />
    <script>
      (() => {
        let preference;
        try { preference = localStorage.getItem("portfolio-theme"); } catch { /* Storage is optional. */ }
        const theme = preference === "light" || preference === "dark"
          ? preference
          : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#1b1c1e" : "#faf9f6";
      })();
    </script>
    <meta
      name="description"
      content="Pourya Moghadam is a Software Engineer building production systems, APIs, and data pipelines, with machine learning expertise and a PhD from the University of Toronto."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Pourya Moghadam — Software Engineer" />
    <meta property="og:description" content="Software engineer with expertise in machine learning. PhD from the University of Toronto." />
    <title>Pourya Moghadam — Software Engineer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
